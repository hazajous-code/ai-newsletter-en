name: Daily scheduled publish

on:
  schedule:
    # 22:05 UTC = 07:05 KST (GitHub may delay scheduled runs)
    - cron: "5 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  promote-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote scheduled issue (scheduled.json, by KST publish date)
        run: python promote.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html marketer.html archive.html scheduled.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "publish: scheduled issue $(date -u +%Y-%m-%d)"
            git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
